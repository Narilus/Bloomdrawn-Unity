criteria:
  - id: ordinary-bootstrap
    assertion: The committed scene enters ordinary Play Mode and automatically creates a fixture combat, EventSystem, runtime hand, and actual runtime-spawned card views without injection.
  - id: pointer-reaches-runtime-card
    assertion: Public pointer movement/down/move/up is raycast and dispatched by the real EventSystem to the same active runtime-spawned card; begin, drag, and end delivery are observed without direct handler calls.
  - id: hover-focus
    assertion: Pointer hover or keyboard focus visibly raises the card above its resting pose/neighbours and leaving focus restores the calculated fan without changing authoritative hand order or canonical gameplay state.
  - id: drag-position
    assertion: After public pointer drag begins, the active card follows the pointer through the declared canvas conversion path without coordinate jump, scale jump, or loss of pointer relationship.
  - id: arm
    assertion: Crossing upward past the responsive Play Area threshold enters DraggingArmed and displays a visible non-colour-only ready cue.
  - id: remain-armed-above
    assertion: Continuing above the threshold, including beyond the Play Area rectangle's upper edge while within usable canvas bounds, remains armed.
  - id: disarm
    assertion: Returning below the threshold enters DraggingDisarmed and removes the armed cue.
  - id: release-below-no-mutation
    assertion: Releasing below cancels and returns to the recalculated fan with zero accepted commands and no Mana, pile, gameplay-event, canonical-state, or named-RNG-stream change.
  - id: target-complete-once
    assertion: Releasing a target-complete runtime card while armed submits exactly one complete accepted command through the normal flow and applies exactly one authoritative transition.
  - id: explicit-target-stage
    assertion: Releasing an explicit-target runtime card while armed submits no command, spends no Mana, mutates no pile/event/RNG state, keeps one visibly staged card, and highlights the legal independent enemy target(s).
  - id: target-cancel
    assertion: Escape and right-click cancellation each return the staged card to the recalculated authoritative hand with no command or gameplay mutation and no detached/stale view.
  - id: legal-target-once
    assertion: Public pointer selection of a legal enemy while staged submits exactly one complete accepted command for the staged card and intended independent enemy.
  - id: repeated-cycles
    minimum_cycles: 10
    assertion: Repeated hover, upward drag, disarm, and cancel cycles preserve authoritative order and produce no positional/rotational drift, duplicate card views, duplicate handlers/submissions, stale references, active-view destruction, coordinate jump, or off-screen/unrecoverable cards.
  - id: click-compatibility
    assertion: Existing click-card then click-target behavior remains functional; target-complete click submits once and explicit-target click stages then legal target click submits once.
    note: This is non-regression only, not final approval of the one-step UX.
  - id: keyboard-compatibility
    assertion: Existing number-key selection remains functional and semantically equivalent to the preserved click route; Escape cancels and current Enter/Space behavior does not regress.
    note: Strict DESIGN 8.5 confirmation alignment is a separate follow-up.
  - id: responsive-layout
    assertion: Every interaction criterion relevant to layout passes against actual runtime views at 1920x1080, 1920x1200, and 3440x1440; hand, staged card, cue, Play Area, targets, and controls remain visible, readable, non-colliding, and in usable bounds.
  - id: runtime-health
    assertion: The tested ordinary-runtime path has no missing scripts, null runtime bindings, unexpected Console errors/exceptions, extra Canvas/EventSystem, or Editor-only gameplay dependency.

state_evidence:
