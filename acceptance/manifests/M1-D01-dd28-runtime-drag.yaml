  independently_capture_ordinary_runtime: true
  verify_no_bypasses_before_trusting_results: true
  verify_protected_hash_and_complete_diff: true
  verdicts:
    - PASS
    - FAIL
    - BLOCKED
  only_pass_certifies_completion: true

completion:
